<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Mycelium</title>
</head>
<body>
  <h1>Reset your password</h1>
  <p>Enter the email address on your account. If it matches, a reset link will be sent.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send reset link</button>
  </form>
</body>
</html>
