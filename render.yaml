services:
  - type: web
    name: mycelium-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    startCommand: python backend/manage.py migrate && gunicorn config.wsgi --chdir backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: mycelium-backend
          property: host
      - key: DB_ENGINE
        value: sqlite
