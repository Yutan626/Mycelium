services:
  - type: web
    name: mycelium-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput
    startCommand: python backend/manage.py migrate && gunicorn config.wsgi --chdir backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECURE
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: mycelium-backend
          property: host
      - key: DB_ENGINE
        value: postgresql
      - key: POSTGRES_DB
        fromDatabase:
          name: mycelium-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: mycelium-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: mycelium-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: mycelium-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: mycelium-db
          property: port

databases:
  - name: mycelium-db
    databaseName: mycelium
    user: mycelium
    plan: basic-256mb
